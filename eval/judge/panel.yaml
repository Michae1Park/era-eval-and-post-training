judges:
  - name: gpt-oss
    provider: openai
    model: openai/gpt-oss-20b
    base_url: http://localhost:8002/v1
    preset: gpt-oss-20b
  - name: gemma
    provider: openai
    model: RedHatAI/gemma-4-31B-it-FP8-block
    base_url: http://localhost:8002/v1
    preset: gemma-4-31b-fp8
  - name: phi
    provider: openai
    model: microsoft/phi-4
    base_url: http://localhost:8002/v1
    preset: phi-4

self_preference_probe:
  name: qwen
  provider: openai
  model: Qwen/Qwen3.6-27B-FP8
  base_url: http://localhost:8001/v1
  preset: qwen3.6-27b-fp8

max_tokens: 4000
evidence_chars: 12000
