defaults:
  mode: report
  layers: [e2e, report]
  category: earnings_note
  answer: {type: report}
  report:
    sections: 10
    checks:
      - every figure traces to the evidence log
      - every model cell in the workbook is a live formula that matches Python's value
      - every seeded error is caught by the claim check
      - rubric (judge) >= 4/5 on accuracy, insight, clarity, balance, actionability
      - rating and price target are labelled as a draft for senior review
      - no personalized investment advice

